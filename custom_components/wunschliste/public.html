<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Wunschliste</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%81%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,650&family=Figtree:wght@400;500;600&display=swap">
<style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>
<style>
/* Layout: one calm column, price bands as sections, each wish a row with price and shop on the right. Winter-frost ground, deep blue accent. */
:root{
  --bg:#f2f4f7; --surface:#ffffff; --ink:#24243a; --muted:#646a7e; --line:#dde1e9;
  --accent:#2b5ea7; --accent-soft:#e2ebf7; --taken:#8a8f9f; --taken-bg:#eceef2; --ok:#2f7a5b;
  --display:"Fraunces", Georgia, "Times New Roman", serif;
  --body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#16171f; --surface:#1f2029; --ink:#ebebf2; --muted:#a2a6b8; --line:#30323f;
  --accent:#8db4ee; --accent-soft:#1d2a3e; --taken:#7d8193; --taken-bg:#262732; --ok:#72c9a1; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#16171f; --surface:#1f2029; --ink:#ebebf2; --muted:#a2a6b8; --line:#30323f;
  --accent:#8db4ee; --accent-soft:#1d2a3e; --taken:#7d8193; --taken-bg:#262732; --ok:#72c9a1; color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5}
.wrap{max-width:820px;margin:0 auto;padding-block:32px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:28px}
header{display:flex;flex-direction:column;gap:10px}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);font-weight:600}
h1{font-family:var(--display);font-weight:650;font-size:clamp(30px,6vw,44px);line-height:1.1;margin:0;text-wrap:balance}
.intro{color:var(--muted);max-width:62ch;margin:0}
.facts{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.fact{font-size:13px;border:1px solid var(--line);border-radius:999px;padding:3px 10px;color:var(--muted);background:var(--surface)}
.fact b{color:var(--ink);font-weight:600}
.howto{background:var(--accent-soft);border-radius:10px;padding:12px 14px;font-size:14px;max-width:62ch}
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:5px 12px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip:focus-visible,.btn:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.toggle{display:flex;gap:6px;align-items:center;font-size:14px;color:var(--muted);margin-left:auto}
section.band{display:flex;flex-direction:column;gap:10px}
.band h2{font-family:var(--display);font-weight:500;font-size:22px;margin:0;display:flex;align-items:baseline;gap:10px}
.band h2 small{font-family:var(--body);font-size:13px;color:var(--muted);font-weight:400}
.band-intro{margin:0;color:var(--muted);font-size:14px;max-width:62ch}
section.band.zeit{background:var(--accent-soft);border-radius:14px;padding:16px}
section.band.zeit h2{color:var(--accent)}
section.band.zeit .band-intro{color:var(--ink)}
section.band.zeit .price{color:var(--accent);font-weight:500;font-size:13px}
ul.items{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:12px}
li.item{display:grid;grid-template-columns:1fr auto;gap:4px 16px;padding:14px 16px;border-top:1px solid var(--line)}
li.item:first-child{border-top:0}
.main{min-width:0;display:flex;flex-direction:column;gap:3px}
.name{font-weight:600;font-size:15.5px}
.note{color:var(--muted);font-size:14px}
.meta{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;font-size:13px;color:var(--muted)}
.theme{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase}
.side{display:flex;flex-direction:column;align-items:flex-end;gap:6px;text-align:right}
.price{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
.links{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end}
a.shop{color:var(--accent);font-weight:600;font-size:14px;text-decoration:none;white-space:nowrap}
a.shop:hover{text-decoration:underline}
a.alt{color:var(--muted);font-size:13px;white-space:nowrap}
.pill{font-size:12px;font-weight:600;border-radius:999px;padding:2px 9px;background:var(--taken-bg);color:var(--taken);white-space:nowrap}
li.taken .name{color:var(--taken);text-decoration:line-through;text-decoration-thickness:1px}
li.taken .note{opacity:.7}
.edit{grid-column:1 / -1;display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding-top:6px}
.btn{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:4px 10px;cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.btn.danger{color:var(--accent)}
.btn:disabled{opacity:.5;cursor:default}
.empty{padding:16px;color:var(--muted);font-size:14px}
form.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px}
form.grid label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);min-width:0}
form.grid .wide{grid-column:1 / -1}
input,select,textarea{font:inherit;font-size:14px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 9px;min-width:0}
.formbar{grid-column:1 / -1;display:flex;gap:8px;justify-content:flex-end}
.editbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:14px;color:var(--muted)}
.status{font-size:13px;color:var(--ok)}
.status.err{color:var(--accent)}
footer{color:var(--muted);font-size:13px;max-width:62ch}
.claim{grid-column:1 / -1;display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding-top:8px}
.claim input{flex:1 1 180px}
.claim .hint{flex-basis:100%;font-size:13px;color:var(--muted);margin:0}
.claim .err{flex-basis:100%;font-size:13px;color:var(--accent);margin:0}
.pill.mine{background:var(--accent-soft);color:var(--accent)}
.toast{position:fixed;left:50%;bottom:max(16px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);border-radius:10px;padding:10px 16px;font-size:14px;max-width:calc(100vw - 32px);box-shadow:0 4px 16px rgba(0,0,0,.2)}
@media (max-width:520px){
  li.item{grid-template-columns:1fr}
  .side{align-items:flex-start;text-align:left;flex-direction:row;flex-wrap:wrap;gap:8px 12px}
  .links{justify-content:flex-start}
  form.grid{grid-template-columns:1fr}
  .toggle{margin-left:0}
}
@media (prefers-reduced-motion:no-preference){.chip,.btn{transition:background .15s,color .15s}}
</style>
</head>
<body>
<div id="app" class="wrap"></div>
<script>
(function(){
  "use strict";

  var BANDS = [
    {key:"zeit", label:"Zeit statt Geld", min:0, max:0, intro:"Im Wochenbett hilft uns Zeit oft mehr als jedes Geschenk. Alles hier kostet nichts außer ein bisschen Zeit, und vieles darf gern mehrfach vergeben werden."},
    {key:"u20", label:"Unter 20 €", min:0, max:20},
    {key:"u50", label:"20 bis 50 €", min:20, max:50},
    {key:"u100", label:"50 bis 100 €", min:50, max:100},
    {key:"o100", label:"Über 100 €", min:100, max:1e9}
  ];
  var state = null;
  var ui = {band:"all", hideTaken:false, claiming:null, busy:false, err:"", toast:""};
  var mine = {}, myName = "";
  try { mine = JSON.parse(localStorage.getItem("wl-mine") || "{}") || {}; myName = localStorage.getItem("wl-name") || ""; } catch(e) {}
  function persistMine(){ try { localStorage.setItem("wl-mine", JSON.stringify(mine)); localStorage.setItem("wl-name", myName); } catch(e) {} }
  try { var s = localStorage.getItem("wl-ui"); if (s) { var o = JSON.parse(s); ui.band = o.band || "all"; ui.hideTaken = !!o.hideTaken; } } catch(e) {}
  function persistUi(){ try { localStorage.setItem("wl-ui", JSON.stringify({band:ui.band, hideTaken:ui.hideTaken})); } catch(e) {} }

  function bandOf(p){ if (!(p > 0)) return "zeit"; for (var i=1;i<BANDS.length;i++){ var b=BANDS[i]; if (p < b.max && p >= b.min) return b.key; } return "o100"; }
  function el(tag, attrs, kids){
    var n = document.createElement(tag);
    if (attrs) for (var k in attrs){ var v = attrs[k]; if (v==null || v===false) continue;
      if (k.slice(0,2)==="on") n.addEventListener(k.slice(2), v); else n.setAttribute(k, v===true?"":v); }
    (kids||[]).forEach(function(c){ if (c!=null) n.appendChild(typeof c==="string"?document.createTextNode(c):c); });
    return n;
  }
  function euro(p){ return !(p>0) ? "kostet nur Zeit" : "ca. " + Math.round(p) + " €"; }
  function safeUrl(u){ return /^https?:\/\//i.test(u||"") ? u : null; }
  function amazonSearch(name){ return "https://www.amazon.de/s?k=" + encodeURIComponent(String(name).replace(/[„“"(),]/g," ").replace(/\s+/g," ").trim()); }
  function cfg(k){ return (state && state.settings && state.settings[k]) || ""; }
  function etLabel(){ try { return new Date(cfg("etDate")+"T00:00:00").toLocaleDateString("de-DE",{day:"numeric",month:"long",year:"numeric"}); } catch(e){ return cfg("etDate"); } }
  function daysToEt(){ if (!cfg("etDate")) return 0; return Math.ceil((new Date(cfg("etDate")+"T00:00:00") - new Date())/86400000); }

  function post(path, body){
    return fetch(path, {method:"POST", cache:"no-store", credentials:"omit", headers:{"Content-Type":"application/json"}, body:JSON.stringify(body)})
      .then(function(r){ return r.json().catch(function(){ return {}; }).then(function(d){ if (!r.ok) throw new Error(d.error || "Das hat nicht geklappt. Bitte noch einmal versuchen."); return d; }); });
  }
  function showToast(t){ ui.toast = t; render(); setTimeout(function(){ if (ui.toast === t) { ui.toast = ""; render(); } }, 4000); }
  function claim(it, name){
    name = (name || "").trim();
    if (!name) { ui.err = "Bitte gib deinen Namen ein, damit wir wissen, bei wem wir uns bedanken dürfen."; render(); return; }
    ui.busy = true; ui.err = ""; render();
    post("/api/wunschliste/vergeben", {id:it.id, name:name}).then(function(d){
      mine[it.id] = d.key; myName = name; persistMine();
      it.taken = true; ui.claiming = null; ui.busy = false;
      showToast("Danke! „" + it.name + "“ ist jetzt für dich reserviert.");
      load();
    }).catch(function(e){ ui.busy = false; ui.err = e.message; render(); load(); });
  }
  function release(it){
    ui.busy = true; render();
    post("/api/wunschliste/freigeben", {id:it.id, key:mine[it.id]}).then(function(){
      delete mine[it.id]; persistMine(); it.taken = false; ui.busy = false;
      showToast("„" + it.name + "“ ist wieder frei.");
      load();
    }).catch(function(e){ ui.busy = false; showToast(e.message); });
  }

  function claimBox(it){
    var input = el("input", {type:"text", maxlength:"100", autocomplete:"name", placeholder:"Dein Name", "aria-label":"Dein Name", value:ui.draft,
      oninput:function(){ ui.draft = input.value; },
      onkeydown:function(ev){ if (ev.key === "Enter") claim(it, input.value); if (ev.key === "Escape") { ui.claiming = null; ui.err = ""; render(); } }});
    if (ui.focusClaim) { ui.focusClaim = false; setTimeout(function(){ try { input.focus(); } catch(e) {} }, 0); }
    return el("div", {"class":"claim"}, [
      input,
      el("button", {"class":"btn primary", disabled:ui.busy, onclick:function(){ claim(it, input.value); }}, [ui.busy ? "Einen Moment …" : "Eintragen"]),
      el("button", {"class":"btn", disabled:ui.busy, onclick:function(){ ui.claiming = null; ui.err = ""; render(); }}, ["Abbrechen"]),
      ui.err ? el("p", {"class":"err", role:"alert"}, [ui.err]) : null,
      el("p", {"class":"hint"}, ["Andere sehen nur „Schon vergeben“. Deinen Namen sehen nur wir."])
    ]);
  }

  function itemRow(it){
    var taken = !!it.taken, url = safeUrl(it.url), links = [], isMine = taken && !!mine[it.id], canClaim = !taken && it.price > 0;
    if (url) links.push(el("a", {"class":"shop", href:url, target:"_blank", rel:"noopener noreferrer"}, ["Bei " + (it.shop || "Shop") + " ansehen"]));
    if (it.price > 0 && !/amazon\./i.test(url||"")) links.push(el("a", {"class":"alt", href:amazonSearch(it.name), target:"_blank", rel:"noopener noreferrer"}, [url ? "oder bei Amazon suchen" : "Bei Amazon suchen"]));
    return el("li", {"class":"item" + (taken && !isMine ? " taken" : "")}, [
      el("div", {"class":"main"}, [
        el("span", {"class":"theme", style:"color:var(--muted)"}, [it.theme || ""]),
        el("span", {"class":"name"}, [it.name]),
        it.note ? el("span", {"class":"note"}, [it.note]) : null
      ]),
      el("div", {"class":"side"}, [
        el("span", {"class":"price"}, [euro(it.price)]),
        taken ? el("span", {"class":"pill" + (isMine ? " mine" : "")}, [isMine ? "Von dir reserviert" : "Schon vergeben"]) : null,
        links.length && (!taken || isMine) ? el("div", {"class":"links"}, links) : null,
        canClaim && ui.claiming !== it.id ? el("button", {"class":"btn primary", onclick:function(){ ui.claiming = it.id; ui.err = ""; ui.draft = myName; ui.focusClaim = true; render(); }}, ["Ich schenke das"]) : null,
        isMine ? el("button", {"class":"btn", disabled:ui.busy, onclick:function(){ release(it); }}, ["Doch nicht"]) : null
      ]),
      ui.claiming === it.id && canClaim ? claimBox(it) : null
    ]);
  }

  function render(){
    var app = document.getElementById("app");
    app.textContent = "";
    var head = el("header", null, [
      el("span", {"class":"eyebrow"}, ["Geschenkliste zur Geburt"]),
      el("h1", null, [cfg("title") || "Unsere Wunschliste"]),
      cfg("intro") ? el("p", {"class":"intro"}, [cfg("intro")]) : null
    ]);
    app.appendChild(head);
    if (state) document.title = cfg("title") || document.title;
    if (!state) { app.appendChild(el("p", {"class":"howto"}, [ui.loadErr ? "Die Liste konnte gerade nicht geladen werden. Bitte später noch einmal versuchen." : "Liste wird geladen …"])); return; }

    var d = daysToEt(), free = state.items.filter(function(i){ return !i.taken; }).length;
    head.appendChild(el("div", {"class":"facts"}, [
      cfg("etDate") ? el("span", {"class":"fact"}, ["Errechneter Termin ", el("b", null, [etLabel()])]) : null,
      d > 0 ? el("span", {"class":"fact"}, ["noch ", el("b", null, [String(d)]), " Tage"]) : null,
      cfg("sizes") ? el("span", {"class":"fact"}, ["Kleidung ", el("b", null, [cfg("sizes")])]) : null,
      el("span", {"class":"fact"}, [el("b", null, [String(free)]), " von " + state.items.length + " Wünschen noch frei"])
    ]));
    if (cfg("howto")) head.appendChild(el("p", {"class":"howto"}, [cfg("howto")]));

    var controls = el("div", {"class":"controls", role:"group", "aria-label":"Preisklasse"});
    [{key:"all", label:"Alle"}].concat(BANDS).forEach(function(b){
      controls.appendChild(el("button", {"class":"chip", "aria-pressed":ui.band===b.key?"true":"false", onclick:function(){ ui.band = b.key; persistUi(); render(); }}, [b.label]));
    });
    var cb = el("input", {type:"checkbox", id:"hide-taken", checked:ui.hideTaken, onchange:function(){ ui.hideTaken = cb.checked; persistUi(); render(); }});
    controls.appendChild(el("label", {"class":"toggle", "for":"hide-taken"}, [cb, "Vergebenes ausblenden"]));
    app.appendChild(controls);

    BANDS.forEach(function(b){
      if (ui.band !== "all" && ui.band !== b.key) return;
      var all = state.items.filter(function(i){ return bandOf(i.price||0) === b.key; });
      var shown = all.filter(function(i){ return !(ui.hideTaken && i.taken); });
      shown.sort(function(a,c){ return (!!a.taken - !!c.taken) || ((a.price||0) - (c.price||0)); });
      var freeN = all.filter(function(i){ return !i.taken; }).length;
      var ul = el("ul", {"class":"items"}, shown.length ? shown.map(itemRow) : [el("li", {"class":"empty"}, [all.length ? "Alles in dieser Preisklasse ist schon vergeben." : "Hier steht noch nichts."])]);
      app.appendChild(el("section", {"class":"band" + (b.key === "zeit" ? " zeit" : ""), "aria-label":b.label}, [
        el("h2", null, [b.label, el("small", null, [b.key === "zeit" ? all.length + " Ideen" : freeN + " frei"])]),
        b.intro ? el("p", {"class":"band-intro"}, [b.intro]) : null,
        ul
      ]));
    });
    if (ui.toast) app.appendChild(el("div", {"class":"toast", role:"status"}, [ui.toast]));
    app.appendChild(el("footer", null, ["Preise sind ungefähre Richtwerte und können sich im Shop ändern. Bei Größen und Farben lieber kurz fragen."]));
  }

  function load(){
    fetch("/api/wunschliste/liste", {cache:"no-store", credentials:"omit"})
      .then(function(r){ if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(function(d){ if (!d || !Array.isArray(d.items)) throw new Error("format"); state = d; ui.loadErr = false;
        // Fremd freigegebene Wünsche aus der eigenen Liste entfernen
        var changed = false;
        Object.keys(mine).forEach(function(id){ var it = d.items.filter(function(i){ return i.id === id; })[0]; if (!it || !it.taken) { delete mine[id]; changed = true; } });
        if (changed) persistMine();
        if (ui.claiming && !ui.busy) { var c = d.items.filter(function(i){ return i.id === ui.claiming; })[0]; if (!c || c.taken) ui.claiming = null; }
        render(); })
      .catch(function(){ if (!state) { ui.loadErr = true; render(); } });
  }
  render();
  load();
  document.addEventListener("visibilitychange", function(){ if (!document.hidden && state) load(); });
})();
</script>
</body>
</html>
